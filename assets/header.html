<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Personal Agent Protocol</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1600px;
      height: 860px;
      overflow: hidden;
      background: #f3ecdf;
    }
    .frame {
      box-sizing: border-box;
      width: 1600px;
      height: 860px;
      position: relative;
      padding: 78px 84px 72px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      column-gap: 36px;
      align-items: center;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 28px;
      border: 1px solid #d9cfc0;
      pointer-events: none;
    }
    .kicker {
      margin: 0 0 28px;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9c4d2b;
    }
    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "New York", "Palatino", serif;
      font-weight: 400;
      font-size: 108px;
      line-height: 0.88;
      letter-spacing: -0.03em;
      color: #1b1916;
    }
    .deck {
      margin: 36px 0 0;
      max-width: 460px;
      font-family: "Iowan Old Style", "New York", "Palatino", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 28px;
      line-height: 1.35;
      color: #3f3a34;
    }
    .doors {
      margin: 40px 0 0;
      display: flex;
      gap: 28px;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #1b1916;
    }
    .doors .on {
      color: #9c4d2b;
    }
    .mark {
      justify-self: end;
      width: 620px;
    }
    .foot {
      position: absolute;
      left: 84px;
      right: 84px;
      bottom: 48px;
      display: flex;
      justify-content: space-between;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8a8175;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="copy">
      <p class="kicker">An open standard</p>
      <h1>Personal<br>Agent<br>Protocol</h1>
      <p class="deck">A customer sends an agent. One session. The business chooses the door.</p>
      <p class="doors"><span>Website</span><span class="on">API</span><span>Company agent</span></p>
    </div>
    <svg class="mark" viewBox="0 0 620 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M78 470 V150 A62 62 0 0 1 202 150 V470" fill="none" stroke="#1b1916" stroke-width="1.75"/>
      <path d="M54 470 H226" fill="none" stroke="#1b1916" stroke-width="1.75"/>
      <circle cx="140" cy="300" r="5.5" fill="#9c4d2b"/>

      <path d="M202 168 C 300 168, 330 112, 372 104" fill="none" stroke="#1b1916" stroke-width="1.6"/>
      <rect x="372" y="62" width="78" height="98" fill="none" stroke="#1b1916" stroke-width="1.6"/>
      <path d="M388 90 H434 M388 106 H422 M388 122 H434" fill="none" stroke="#1b1916" stroke-width="1.3"/>
      <text x="490" y="118" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4" fill="#1b1916">WEBSITE</text>

      <path d="M202 300 H372" fill="none" stroke="#9c4d2b" stroke-width="1.9"/>
      <rect x="372" y="276" width="32" height="32" fill="none" stroke="#9c4d2b" stroke-width="1.7"/>
      <rect x="414" y="276" width="32" height="32" fill="none" stroke="#9c4d2b" stroke-width="1.7"/>
      <rect x="456" y="276" width="32" height="32" fill="#9c4d2b"/>
      <text x="508" y="300" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4" fill="#9c4d2b">API</text>

      <path d="M202 432 C 300 432, 330 470, 360 486" fill="none" stroke="#1b1916" stroke-width="1.6"/>
      <circle cx="392" cy="498" r="26" fill="none" stroke="#1b1916" stroke-width="1.6"/>
      <circle cx="432" cy="498" r="26" fill="none" stroke="#1b1916" stroke-width="1.6"/>
      <text x="478" y="506" font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4" fill="#1b1916">AGENT</text>
    </svg>
    <p class="foot">
      <span>6 October 2026</span>
      <span>A reading model, ahead of the v0.1 specification</span>
    </p>
  </div>
</body>
</html>
